<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="48" font-family="Arial" font-size="30" font-weight="700" fill="#102060">Lap Counting and Debouncing</text>
<rect x="170" y="110" width="560" height="58" rx="16" fill="#F4F7FB" stroke="#215FAE" stroke-width="2"/>
<text x="450.0" y="146.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="600" fill="#172033">Marker Detected</text>
<line x1="450.0" y1="168" x2="450.0" y2="190" stroke="#215FAE" stroke-width="3"/>
<polygon points="450.0,200 443.0,188 457.0,188" fill="#215FAE"/>
<rect x="170" y="200" width="560" height="58" rx="16" fill="#F4F7FB" stroke="#215FAE" stroke-width="2"/>
<text x="450.0" y="236.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="600" fill="#172033">Is Detection New?</text>
<line x1="450.0" y1="258" x2="450.0" y2="280" stroke="#215FAE" stroke-width="3"/>
<polygon points="450.0,290 443.0,278 457.0,278" fill="#215FAE"/>
<rect x="170" y="290" width="560" height="58" rx="16" fill="#F4F7FB" stroke="#215FAE" stroke-width="2"/>
<text x="450.0" y="326.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="600" fill="#172033">Ignore duplicate OR Count Lap</text>
<line x1="450.0" y1="348" x2="450.0" y2="370" stroke="#215FAE" stroke-width="3"/>
<polygon points="450.0,380 443.0,368 457.0,368" fill="#215FAE"/>

<text x="450.0" y="416.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="600" fill="#172033">Wait for Marker to Leave Region</text>
<line x1="450.0" y1="438" x2="450.0" y2="460" stroke="#215FAE" stroke-width="3"/>
<polygon points="450.0,470 443.0,458 457.0,458" fill="#215FAE"/>
<rect x="170" y="470" width="560" height="58" rx="16" fill="#F4F7FB" stroke="#215FAE" stroke-width="2"/>
<text x="450.0" y="506.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="600" fill="#172033">Ready for Next Lap</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="395"><rect width="100%" height="100%" rx="24" fill="white"/>
<text x="50" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#102060">Engineering Objectives</text>
<circle cx="60" cy="100" r="6" fill="#215FAE"/>
<text x="78" y="106" font-family="Arial" font-size="17" fill="#172033">Build a mechanically stable and</text>
<text x="78" y="128" font-family="Arial" font-size="17" fill="#172033">predictable vehicle.</text>
<circle cx="60" cy="156" r="6" fill="#215FAE"/>
<text x="78" y="162" font-family="Arial" font-size="17" fill="#172033">Create a reliable steering mechanism.</text>
<circle cx="60" cy="212" r="6" fill="#215FAE"/>
<text x="78" y="218" font-family="Arial" font-size="17" fill="#172033">Balance motor torque and speed instead of</text>
<text x="78" y="240" font-family="Arial" font-size="17" fill="#172033">maximising only one.</text>
<circle cx="60" cy="268" r="6" fill="#215FAE"/>
<text x="78" y="274" font-family="Arial" font-size="17" fill="#172033">Keep the robot compact and lightweight.</text>
<circle cx="60" cy="324" r="6" fill="#215FAE"/>
<text x="78" y="330" font-family="Arial" font-size="17" fill="#172033">Make the chassis modular so mechanical</text>
<text x="78" y="352" font-family="Arial" font-size="17" fill="#172033">changes could be made quickly.</text>
<circle cx="555" cy="100" r="6" fill="#215FAE"/>
<text x="573" y="106" font-family="Arial" font-size="17" fill="#172033">Use computer vision as the primary source</text>
<text x="573" y="128" font-family="Arial" font-size="17" fill="#172033">of environmental information.</text>
<circle cx="555" cy="156" r="6" fill="#215FAE"/>
<text x="573" y="162" font-family="Arial" font-size="17" fill="#172033">Use the IMU and IR sensors as</text>
<text x="573" y="184" font-family="Arial" font-size="17" fill="#172033">complementary feedback.</text>
<circle cx="555" cy="212" r="6" fill="#215FAE"/>
<text x="573" y="218" font-family="Arial" font-size="17" fill="#172033">Create a reliable power distribution</text>
<text x="573" y="240" font-family="Arial" font-size="17" fill="#172033">system.</text>
<circle cx="555" cy="268" r="6" fill="#215FAE"/>
<text x="573" y="274" font-family="Arial" font-size="17" fill="#172033">Build modular software so individual</text>
<text x="573" y="296" font-family="Arial" font-size="17" fill="#172033">systems could be tested independently.</text>
<circle cx="555" cy="324" r="6" fill="#215FAE"/>
<text x="573" y="330" font-family="Arial" font-size="17" fill="#172033">Document the final robot sufficiently for</text>
<text x="573" y="352" font-family="Arial" font-size="17" fill="#172033">another team to understand and reproduce</text>
<text x="573" y="374" font-family="Arial" font-size="17" fill="#172033">it.</text>
</svg>